# Creates a semver tag and GitHub release from conventional-commit PR titles.
# See https://github.com/Health-Informatics-UoN/workflows/blob/main/docs/samples/release.container.md

name: Release
permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@e0603aaa45d8ecfcb1797d0bf8b8206f551c41ef # v 1.8.2
    with:
      node-version: "24"
    secrets: inherit

