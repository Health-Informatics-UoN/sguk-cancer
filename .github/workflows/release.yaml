# Creates a semver tag and GitHub release from conventional-commit PR titles.
# See https://github.com/Health-Informatics-UoN/workflows/blob/main/docs/samples/release.container.md

name: Release
permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@15094723210390297bb74ab15bad76e276c47b3d # v 1.9.0
    with:
      node-version: "24"
    secrets: inherit

