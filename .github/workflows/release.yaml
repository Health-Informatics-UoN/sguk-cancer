# Creates a semver tag and GitHub release from conventional-commit PR titles.
# See https://github.com/Health-Informatics-UoN/workflows/blob/main/docs/samples/release.container.md

name: Release
permissions:
  contents: write
  pull-requests: write
  issues: write

on:
  push:
    branches:
      - main

jobs:
  release:
    uses: health-informatics-uon/workflows/.github/workflows/semantic-release.yml@db2532bb431e9b162274ce81b591c6c53b32090f # v 1.7.0
    with:
      node-version: "24"
    secrets: inherit

