name: OSV-Scanner Scheduled Scan

on:
  schedule:
    # 12:30pm UTC every Monday
    - cron: "30 12 * * 1"
  push:
    branches: [main]

permissions:
  # Required to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
  actions: read
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Only need to read contents
  contents: read

jobs:
  export-renv-lockfile:
  # osv doesn't support rv lockfiles, but it does support renv
  # rv can export an renv lockfile
  uses: health-informatics-uon/omop-r-toolkit/.github/workflows/osv-scan-rv.yml@598e44264710c324253329c1e329ca9af74b4e4a
  secrets: inherit